name: coletar dados do TSE

# ATENÇÃO — este job NÃO roda em runner hospedado pelo GitHub.
#
# O CDN do TSE está atrás de Akamai e devolve 403 para faixas de IP de
# datacenter. Verificado em 10/09/2026: da máquina do mantenedor (IP
# residencial brasileiro) responde 200; do runner ubuntu-latest do GitHub
# Actions responde 403, tanto o CDN quanto o portal CKAN.
#
# Para automatizar a coleta é preciso um runner com IP que o TSE aceite —
# um self-hosted runner numa máquina brasileira, ou um VPS no Brasil.
# Configure a variável RUNNER_COLETA do repositório com o label desse runner.
# Enquanto ela não existir, este workflow só roda sob demanda e vai falhar
# em 403, de propósito e de forma visível.
#
# Até lá, a coleta é local: `npm run build:data` e commit do data/build/.
on:
  schedule:
    - cron: "17 9 * * *"   # 06:17 em Brasília
  workflow_dispatch:

jobs:
  coletar:
    runs-on: ${{ vars.RUNNER_COLETA || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.18"
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Baixar dados do TSE
        run: npm run fetch

      # Lê só o índice dos pacotes de proposta, por Range: ~8 KB por UF em vez
      # de ~14 MB. Nenhum PDF é baixado.
      - name: Indexar propostas de governo
        run: npm run propostas -- --uf=all

      - name: Normalizar
        run: npm run normalize -- --uf=all

      - name: Validar invariantes
        run: npm run validate

      - name: Abrir PR se o dado mudou
        uses: peter-evans/create-pull-request@v6
        with:
          branch: dados/atualizacao-tse
          title: "dados: atualização do pacote do TSE"
          commit-message: "dados: atualização do pacote do TSE"
          body: |
            Regeneração automática a partir de `consulta_cand_2026.zip`.

            Confira antes de aprovar:
            - o diff de contagem por cargo em `data/build/meta.json`;
            - a lista de `anomalias` — candidaturas duplicadas e chapas incompletas;
            - `situacaoRegistro.comSituacao`: quando deixar de ser 0, o TSE passou a
              publicar a situação do registro e o alerta da §5.4 vira implementável.
          add-paths: data/build
