name: dados do TSE

# Cron diário (§0.1): refetch -> normalize -> validate -> PR.
# Nunca faz commit direto na branch principal: mudança de dado de candidatura
# em período eleitoral tem que passar por revisão humana com diff à vista.
# O cron diário está DESLIGADO, e não por esquecimento.
#
# O CDN do TSE está atrás de Akamai e bloqueia por IP: a mesma chamada que
# funciona de um IP residencial brasileiro devolve 403 dos runners do GitHub.
# Verificado em quatro execuções seguidas (runs 34605378034, 34694915825,
# 34760894037, 34865229092), todas falhando em "Baixar dados do TSE" com 403 —
# exatamente o que o README previa desde o M1.
#
# Enquanto não houver runner com IP brasileiro, a atualização é manual:
#
#   npm run fetch && npm run normalize -- --uf=all && npm run alianca && npm run validate
#   git add data/build && git commit && git push
#
# Deixar o cron ligado só produziria uma falha vermelha por dia num repositório
# público, treinando todo mundo a ignorar o sinal. Ele volta no dia em que a
# coleta rodar de algum lugar que o TSE atenda.
on:
  workflow_dispatch:
  pull_request:
    paths: ["scripts/**", "tests/**", "package.json", "tsconfig.json"]

permissions:
  contents: write
  pull-requests: write

jobs:
  dados:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.18"

      - run: npm ci --no-audit --no-fund

      - name: Tipos
        run: npm run typecheck

      - name: Testes
        run: npm test

      # O CDN do TSE está atrás de Akamai e devolve 403 para clientes que não
      # pareçam navegador. Se este passo falhar em 403 no runner do GitHub e
      # passar na sua máquina, o bloqueio é por IP do runner — não por código.
      - name: Baixar dados do TSE
        run: npm run fetch

      - name: Normalizar
        run: npm run normalize -- --uf=all

      - name: Grafo de aliança
        run: npm run alianca

      - name: Validar invariantes
        run: npm run validate

      - name: Abrir PR se o dado mudou
        if: github.event_name != 'pull_request'
        uses: peter-evans/create-pull-request@v6
        with:
          branch: dados/atualizacao-tse
          title: "dados: atualização do pacote do TSE"
          commit-message: "dados: atualização do pacote do TSE"
          body: |
            Regeneração automática a partir de `consulta_cand_2026.zip`.

            Confira antes de aprovar:
            - o diff de contagem por cargo em `data/build/meta.json`;
            - a lista de `anomalias` — candidaturas duplicadas e chapas incompletas;
            - `situacaoRegistro.comSituacao`: quando deixar de ser 0, o TSE passou a
              publicar a situação do registro e o alerta da §5.4 vira implementável;
            - `alianca.json`: mudança de coligação muda o índice de coerência de todo
              mundo, então o diff das arestas merece leitura antes de aprovar.
          add-paths: data/build
